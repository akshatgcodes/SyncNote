services:
  - type: web
    name: syncnote-server
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm ci && cd ../client && npm ci && npm run build && cd ../landing && npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
